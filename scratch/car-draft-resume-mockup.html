<title>استكمال إعلان السيارة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap');

:root {
  --bg-a: #eaf2ff;
  --bg-b: #f3eeff;
  --bg-c: #fff6ee;
  --page-ink: #0f172a;

  --glass-fill: rgba(255,255,255,0.58);
  --glass-fill-strong: rgba(255,255,255,0.78);
  --glass-border: rgba(255,255,255,0.65);
  --glass-shadow: rgba(15,23,42,0.14);

  --text-primary: #0f172a;
  --text-secondary: #4b5568;
  --text-muted: #8791a3;

  --accent: #2563eb;
  --accent-ink: #ffffff;
  --accent-soft: rgba(37,99,235,0.14);

  --danger: #dc2626;
  --danger-soft: rgba(220,38,38,0.10);

  --track: rgba(15,23,42,0.08);

  --tile-1a: #6ea8ff; --tile-1b: #2f5fd6;
  --tile-2a: #ffb27a; --tile-2b: #e8793a;
  --tile-3a: #8f8bff; --tile-3b: #5a4fd8;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-a: #0b1220;
    --bg-b: #14152a;
    --bg-c: #1c1526;
    --page-ink: #eef1f8;

    --glass-fill: rgba(30,34,48,0.55);
    --glass-fill-strong: rgba(38,42,58,0.72);
    --glass-border: rgba(255,255,255,0.10);
    --glass-shadow: rgba(0,0,0,0.45);

    --text-primary: #eef1f8;
    --text-secondary: #aab2c5;
    --text-muted: #757e93;

    --accent: #6d94ff;
    --accent-ink: #0b1220;
    --accent-soft: rgba(109,148,255,0.18);

    --danger: #ff6b6b;
    --danger-soft: rgba(255,107,107,0.14);

    --track: rgba(255,255,255,0.10);
  }
}

:root[data-theme="dark"] {
  --bg-a: #0b1220;
  --bg-b: #14152a;
  --bg-c: #1c1526;
  --page-ink: #eef1f8;

  --glass-fill: rgba(30,34,48,0.55);
  --glass-fill-strong: rgba(38,42,58,0.72);
  --glass-border: rgba(255,255,255,0.10);
  --glass-shadow: rgba(0,0,0,0.45);

  --text-primary: #eef1f8;
  --text-secondary: #aab2c5;
  --text-muted: #757e93;

  --accent: #6d94ff;
  --accent-ink: #0b1220;
  --accent-soft: rgba(109,148,255,0.18);

  --danger: #ff6b6b;
  --danger-soft: rgba(255,107,107,0.14);

  --track: rgba(255,255,255,0.10);
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
}

body {
  margin: 0;
  background:
    radial-gradient(120% 90% at 15% -10%, var(--bg-a) 0%, transparent 55%),
    radial-gradient(120% 90% at 100% 0%, var(--bg-b) 0%, transparent 55%),
    radial-gradient(140% 100% at 50% 120%, var(--bg-c) 0%, transparent 60%),
    var(--bg-a);
  color: var(--text-primary);
  font-family: 'Almarai', 'Segoe UI', sans-serif;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

.stage {
  position: relative;
  min-height: 100dvh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: clamp(1.25rem, 5vw, 3rem) clamp(1rem, 4vw, 2rem);
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.55;
  pointer-events: none;
}
.orb-1 { width: 46vw; height: 46vw; max-width: 420px; max-height: 420px; top: -12%; left: -10%; background: var(--accent); opacity: 0.16; }
.orb-2 { width: 40vw; height: 40vw; max-width: 380px; max-height: 380px; bottom: -14%; right: -8%; background: var(--tile-2a); opacity: 0.18; }
.orb-3 { width: 30vw; height: 30vw; max-width: 260px; max-height: 260px; top: 30%; right: 6%; background: var(--tile-3a); opacity: 0.14; }

.phone {
  position: relative;
  z-index: 1;
  width: clamp(300px, 88vw, 390px);
  border-radius: clamp(24px, 8vw, 40px);
  padding: clamp(6px, 1.6vw, 10px);
  background: linear-gradient(160deg, rgba(255,255,255,0.5), rgba(255,255,255,0.08));
  box-shadow: 0 30px 60px -20px var(--glass-shadow);
}

.screen {
  direction: rtl;
  border-radius: clamp(18px, 6vw, 32px);
  overflow: hidden;
  background: var(--glass-fill);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  border: 1px solid var(--glass-border);
  min-height: clamp(620px, 88dvh, 780px);
  display: flex;
  flex-direction: column;
  position: relative;
}

.notch {
  width: 120px;
  height: 22px;
  background: var(--page-ink);
  opacity: 0.85;
  border-radius: 0 0 16px 16px;
  margin: 0 auto;
  position: relative;
  z-index: 3;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 1.25rem 0.5rem;
}

.iconbtn {
  width: 38px;
  height: 38px;
  border-radius: 14px;
  background: var(--glass-fill-strong);
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  backdrop-filter: blur(14px);
}

.topbar-title {
  font-weight: 700;
  font-size: 15px;
  color: var(--text-primary);
}

.content {
  flex: 1;
  padding: 0.75rem 1.25rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
}

.eyebrow {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.02em;
}

.headline {
  font-size: 20px;
  font-weight: 800;
  color: var(--text-primary);
  line-height: 1.4;
  text-wrap: balance;
  margin: 0;
}

.stack-card {
  border-radius: 24px;
  background: var(--glass-fill-strong);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px);
  box-shadow: 0 18px 40px -18px var(--glass-shadow);
  padding: 1.1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.photo-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.photo-stack {
  display: flex;
  flex-direction: row-reverse;
}

.tile {
  width: 58px;
  height: 58px;
  border-radius: 16px;
  border: 2px solid var(--glass-fill-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.92);
  margin-inline-start: -16px;
  box-shadow: 0 6px 14px -6px var(--glass-shadow);
}
.photo-stack .tile:first-child { margin-inline-start: 0; }

.tile.t1 { background: linear-gradient(145deg, var(--tile-1a), var(--tile-1b)); }
.tile.t2 { background: linear-gradient(145deg, var(--tile-2a), var(--tile-2b)); }
.tile.t3 { background: linear-gradient(145deg, var(--tile-3a), var(--tile-3b)); }

.tile-more {
  width: 58px;
  height: 58px;
  border-radius: 16px;
  background: var(--track);
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-inline-start: -16px;
  border: 2px solid var(--glass-fill-strong);
}

.photo-caption {
  margin-inline-start: auto;
  text-align: left;
  font-size: 11.5px;
  color: var(--text-muted);
}

.title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.draft-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--text-primary);
  margin: 0;
  line-height: 1.4;
}

.category-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 999px;
  padding: 5px 11px;
  margin-top: 6px;
  white-space: nowrap;
}

.progress-ring {
  width: 52px;
  height: 52px;
  flex-shrink: 0;
  position: relative;
}
.progress-ring svg { transform: rotate(-90deg); }
.progress-ring .pct {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.meta-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-muted);
  border-top: 1px solid var(--glass-border);
  padding-top: 0.85rem;
}

.dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted); }

.spacer { flex: 1; }

.actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

button {
  font-family: inherit;
  border: none;
  border-radius: 16px;
  padding: 15px 18px;
  font-size: 14.5px;
  font-weight: 800;
  cursor: pointer;
  transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
}
button:active { transform: scale(0.98); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: 0 16px 30px -14px var(--accent-soft), 0 4px 10px -4px var(--accent-soft);
}
.btn-primary:hover { box-shadow: 0 20px 36px -14px var(--accent-soft); }

.btn-ghost {
  background: var(--glass-fill-strong);
  border: 1px solid var(--glass-border);
  color: var(--danger);
  backdrop-filter: blur(14px);
}

.hairline {
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
  margin: 0.1rem 0 0.2rem;
}

.home-indicator {
  width: 120px;
  height: 4px;
  border-radius: 2px;
  background: var(--text-muted);
  opacity: 0.4;
  margin: 10px auto 6px;
}
</style>

<h2 class="sr-only">معاينة تصميم شاشة استكمال مسودة إعلان السيارة بنمط زجاجي فاتح</h2>

<div class="stage">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="phone">
  <div class="screen">
    <div class="notch"></div>

    <div class="topbar">
      <button class="iconbtn" aria-label="رجوع">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <span class="topbar-title">إعلانات غير مكتملة</span>
      <div style="width:38px"></div>
    </div>

    <div class="content">
      <div>
        <div class="eyebrow">لديك مسودة محفوظة</div>
        <h1 class="headline">أكمل من حيث توقفت، أو ابدأ إعلاناً جديداً</h1>
      </div>

      <div class="stack-card">
        <div class="photo-row">
          <div class="photo-stack">
            <div class="tile t1">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-1.4-5.6a2 2 0 0 0-1.94-1.4H8.34a2 2 0 0 0-1.94 1.4L5 17z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/><path d="M5 17v-2M19 17v-2"/></svg>
            </div>
            <div class="tile t2">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
            <div class="tile t3">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-5h14l2 5M5 12v6h2v-2h10v2h2v-6"/></svg>
            </div>
            <div class="tile-more">+2</div>
          </div>
          <span class="photo-caption">5 صور مرفقة</span>
        </div>

        <div class="title-row">
          <div>
            <p class="draft-title">تويوتا كامري 2023 — فل كامل</p>
            <span class="category-pill">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14l-1.4-5.6a2 2 0 0 0-1.94-1.4H8.34a2 2 0 0 0-1.94 1.4L5 17z"/><circle cx="7.5" cy="17" r="1.5"/><circle cx="16.5" cy="17" r="1.5"/></svg>
              سيارات
            </span>
          </div>
          <div class="progress-ring">
            <svg width="52" height="52" viewBox="0 0 52 52">
              <circle cx="26" cy="26" r="22" fill="none" stroke="var(--track)" stroke-width="5"/>
              <circle cx="26" cy="26" r="22" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="27.6"/>
            </svg>
            <span class="pct">80%</span>
          </div>
        </div>

        <div class="hairline"></div>

        <div class="meta-row">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>آخر حفظ منذ 12 دقيقة</span>
          <span class="dot"></span>
          <span>الخطوة 4 من 5</span>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="actions">
        <button class="btn-primary">استكمال الإعلان</button>
        <button class="btn-ghost">مسح المسودة والبدء من جديد</button>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
  </div>
</div>
