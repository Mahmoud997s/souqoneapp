name: Expo EAS Update

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message'
        required: false
        type: string

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Create .env file for build
        run: |
          echo "EXPO_PUBLIC_API_URL=https://caroneapi-production-255b.up.railway.app/api/v1" >> .env
          echo "EXPO_PUBLIC_SOCKET_URL=https://caroneapi-production-255b.up.railway.app" >> .env
          echo "EXPO_PUBLIC_CLOUDINARY_CLOUD=dityoyp85" >> .env

      - name: Publish Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_MSG: ${{ inputs.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          MSG="${INPUT_MSG:-$COMMIT_MSG}"
          CLEAN_MSG=""
          if [ -n "$MSG" ]; then
            CLEAN_MSG=$(printf '%s\n' "$MSG" | head -n 1)
          fi
          if [ -z "${CLEAN_MSG//[[:space:]]/}" ]; then
            SHORT_SHA="${COMMIT_SHA:0:7}"
            CLEAN_MSG="manual OTA update ${SHORT_SHA:-update}"
          fi
          eas update --branch preview --message "$CLEAN_MSG" --non-interactive
